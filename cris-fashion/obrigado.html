<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadastro confirmado — Achadinhos da Cris Fashion</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#b81b66">
<link rel="icon" href="assets/img/logo-marca.svg" type="image/svg+xml">

<link rel="preload" href="assets/fonts/playfair-display-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/jost-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<main class="tela-obrigado">
  <div class="obrigado">

    <div class="obrigado__marca">
      <div class="marca" role="img" aria-label="Cris Fashion">
        <span class="marca__lockup">
          <span class="marca__nome">Cris</span>
          <span class="marca__linha"></span>
          <span class="marca__assinatura">fashion</span>
        </span>
      </div>
    </div>

    <p class="confirmado">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"></circle><path d="M8 12.5l2.6 2.5L16 9.5"></path>
      </svg>
      Cadastro confirmado
    </p>

    <h1 class="titulo">Pronto! Você já é do <em>Achadinhos</em></h1>
    <p class="obrigado__texto">
      Falta só entrar no grupo do WhatsApp para começar a receber as peças com
      <strong>até 50% de desconto</strong>. Estamos te levando para lá.
    </p>

    <div class="carregando">
      <p class="carregando__texto">
        Redirecionando para o grupo em <strong data-contador>10</strong> segundos…
      </p>
      <div class="barra" role="progressbar" aria-label="Redirecionando para o grupo"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-barra>
        <span class="barra__preenchimento" data-barra-preenchimento></span>
      </div>
    </div>

    <a class="botao botao--claro botao--largo" href="https://chat.whatsapp.com/J15xI3EcaZ3Bx1p3YC168l"
       target="_blank" rel="noopener" data-grupo-link>Entrar no grupo agora</a>

    <p class="obrigado__volta"><a href="index.html">Voltar para a página inicial</a></p>

  </div>
</main>

<script src="assets/js/app.js" defer></script>
</body>
</html>
